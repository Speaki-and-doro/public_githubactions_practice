name: Contexts env variables
on: push
jobs:
  print: 
    runs-on: ubuntu-latest
    env: 
      ACTOR: "${{ github.actor }}"
      HEAD_REF: "${{ github.head_ref }}"
      WORKSPACE: "${{ github.workspace }}"
      REPO: "${{ github.repository }}"
      EVENT: "${{ github.event }}"
    steps: 
      - run: echo "${ACTOR}"
      - run: echo "&{HEAD_REF}"
      - run: echo "&{WORKSPACE}"
      - run: echo "&{REPO}"
      - run: echo "&{EVENT}"